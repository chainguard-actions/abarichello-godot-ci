name: Test godot-ci action image reference
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the godot-ci Docker action under test.
      # The action uses docker://barichello/godot-ci and has no entrypoint,
      # so it exits cleanly after the container starts.
      # continue-on-error is set because the image is very large and may time
      # out in constrained CI environments.
      - name: Invoke godot-ci action
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action.yml references godot-ci image
        run: |
          echo "Verifying action.yml references the godot-ci Docker image..."
          if grep -q "barichello/godot-ci" tests/fixtures/action.yml; then
            echo "PASS: action.yml references barichello/godot-ci image"
          else
            echo "FAIL: action.yml does not reference barichello/godot-ci image"
            exit 1
          fi

      - name: Assert action uses Docker runtime
        run: |
          echo "Verifying action uses Docker runtime..."
          if grep -q "using: 'docker'" tests/fixtures/action.yml; then
            echo "PASS: action uses Docker runtime"
          else
            echo "FAIL: action does not use Docker runtime"
            exit 1
          fi

      - name: Assert action has required metadata fields
        run: |
          echo "Verifying action.yml has required metadata..."
          if grep -q "^name:" tests/fixtures/action.yml; then
            echo "PASS: action has name field"
          else
            echo "FAIL: action missing name field"
            exit 1
          fi
          if grep -q "^description:" tests/fixtures/action.yml; then
            echo "PASS: action has description field"
          else
            echo "FAIL: action missing description field"
            exit 1
          fi
          echo "PASS: all required metadata fields present"

      - name: Assert action author is set
        run: |
          echo "Verifying action has author field..."
          if grep -q "^author:" tests/fixtures/action.yml; then
            echo "PASS: action has author field"
          else
            echo "FAIL: action missing author field"
            exit 1
          fi

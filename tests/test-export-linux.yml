name: Test godot-ci - export scenario (Docker action runs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Prepare export output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/export-output/linux"

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert Docker container started for export scenario
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The godot-ci Docker image provides the Godot export environment.
          # The action.yml has no defined entrypoint/inputs, so the container
          # runs the image default. It may succeed or fail depending on the
          # image's default CMD, but it must not be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — Docker container did not start"
            exit 1
          fi
          echo "PASS: godot-ci Docker container started for export scenario (outcome=$OUTCOME)"

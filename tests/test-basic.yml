name: Test godot-ci action basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The godot-ci action is a Docker action (docker://barichello/godot-ci).
      # It has no inputs, outputs, or entrypoint — invoking it verifies the
      # Docker image can be pulled and the container exits cleanly.
      # continue-on-error is set because the image is very large and may time
      # out in constrained CI environments.
      - name: Invoke godot-ci action
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action uses Docker runtime
        run: |
          echo "Verifying action uses Docker runtime..."
          if grep -q "using: 'docker'" tests/fixtures/action.yml; then
            echo "PASS: action uses Docker runtime"
          else
            echo "FAIL: action does not use Docker runtime"
            exit 1
          fi

      - name: Assert action references godot-ci image
        run: |
          echo "Verifying action references barichello/godot-ci..."
          if grep -q "barichello/godot-ci" tests/fixtures/action.yml; then
            echo "PASS: action references barichello/godot-ci"
          else
            echo "FAIL: action does not reference barichello/godot-ci"
            exit 1
          fi

      - name: Assert action has name and description
        run: |
          echo "Verifying action has required metadata fields..."
          if grep -q "^name: godot-ci" tests/fixtures/action.yml; then
            echo "PASS: action has name field"
          else
            echo "FAIL: action missing name field"
            exit 1
          fi
          if grep -q "^description:" tests/fixtures/action.yml; then
            echo "PASS: action has description field"
          else
            echo "FAIL: action missing description field"
            exit 1
          fi
          echo "PASS: all required metadata fields present"
